[package]
name = "wallet-core-common"
version = "0.1.0"
edition = "2021"

[features]
default = []
aes = ["dep:aes", "dep:cbc"]
bip32 = ["dep:bitcoin"]
btc = ["dep:bitcoin"]
ckb-address = ["dep:bech32", "dep:bitcoin", "dep:blake2b-rs"]
cosmos = ["dep:bech32", "dep:bitcoin"]
curve = ["dep:serde"]
eth = ["dep:keccak-hash"]
filecoin = ["dep:base32", "dep:blake2b-rs"]
hash = ["dep:bitcoin", "dep:keccak-hash"]
path = ["dep:bitcoin"]
tezos = ["dep:bitcoin", "dep:blake2b_simd"]
tron = ["dep:bitcoin", "dep:keccak-hash"]

[dependencies]
aes = { version = "=0.9.0", optional = true }
base32 = { version = "=0.5.1", optional = true }
bech32 = { version = "=0.11.1", optional = true }
bitcoin = { version = "=0.32.9", optional = true }
blake2b-rs = { version = "=0.2.0", optional = true }
blake2b_simd = { version = "=1.0.4", optional = true }
cbc = { version = "=0.2.1", optional = true }
hex = "=0.4.3"
keccak-hash = { version = "=0.12.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
