name: CI Quality Gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.12"
  KDF_ROUNDS: "1"

jobs:
  release-policy:
    name: release policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/release-gate.test.mjs

  packaging-policy:
    name: Android packaging policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p test_android_aar.py
      - run: bash -n script/build-android.sh

  fmt:
    name: cargo fmt
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust
        run: rustup component add clippy

      - name: Install dependency
        run: brew install protobuf

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test-no-run:
    name: cargo test --no-run
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-no-run-${{ hashFiles('Cargo.lock') }}

      - name: Install dependency
        run: brew install protobuf

      - name: Compile workspace test targets
        run: cargo test --locked --workspace --no-run

  host-tests:
    name: host-safe unit tests
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-tests-${{ hashFiles('Cargo.lock') }}

      - name: Install dependency
        run: brew install protobuf

      - name: Run TokenCore host tests
        run: make test-tcx

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Run imKey host-safe tests
        run: make test-ikc

      - name: Run npm JS tests
        run: make test-npm

      - name: Run mobile FFI ownership mocks
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/net/java/dev/jna/jna/5.10.0/jna-5.10.0.jar -o "$RUNNER_TEMP/jna.jar"
          echo "e335c10679f743207d822c5f7948e930319835492575a9dba6b94f8a3b96fcc8  $RUNNER_TEMP/jna.jar" | shasum -a 256 --check
          JNA_JAR="$RUNNER_TEMP/jna.jar" make test-mobile-ffi

  kdf-features:
    name: KDF contracts (${{ matrix.features || 'default' }})
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        features: ["", "cache_dk", "test_api", "cache_dk,test_api"]
    env:
      TCX_FEATURES: ${{ matrix.features }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kdf-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependency
        run: brew install protobuf

      - name: Compile API test targets
        run: cargo test --locked -p tcx --features "$TCX_FEATURES" --no-run

      - name: Run KDF API contracts
        run: cargo test --locked -p tcx --features "$TCX_FEATURES" --test other_test test_kdf_api_formats_and_feature_gates -- --test-threads=1

  wasm-check:
    name: wasm check
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: brew install llvm protobuf

      - name: Install wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add llvm-tools-preview

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: browser-actions/setup-chrome@v1

      - name: Run wasm check
        run: make test-wasm

      - name: Run wasm Node smoke
        run: make test-wasm-node

      - name: Run wasm browser session smoke
        run: make test-wasm-browser

      - name: Verify packed npm consumer
        run: make test-npm-package

  docs-links:
    name: markdown links
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-path vendor
            --exclude-path node_modules
            --exclude-path .next
            --exclude-path token-core/tcx-examples/iOSExample/Pods
            --exclude-path imkey-core/mobile-sdk/ios/Example/Pods
            --exclude-path imkey-core/ikc-examples/ios/Pods
            './**/*.md'
          fail: true

  dependency-policy:
    name: dependency audit and licenses
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: nightly-2026-04-06
          command: check advisories licenses sources
