name: CI Quality Gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.12"
  KDF_ROUNDS: "1"

jobs:
  fmt:
    name: cargo fmt
    runs-on: macos-14
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: macos-14
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust
        run: rustup component add clippy

      - name: Install dependency
        run: brew install protobuf

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-no-run:
    name: cargo test --no-run
    runs-on: macos-14
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-no-run-${{ hashFiles('Cargo.lock') }}

      - name: Install dependency
        run: brew install protobuf

      - name: Compile workspace test targets
        run: cargo test --workspace --no-run

  host-tests:
    name: host-safe unit tests
    runs-on: macos-14
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-host-tests-${{ hashFiles('Cargo.lock') }}

      - name: Install dependency
        run: brew install protobuf

      - name: Run TokenCore host tests
        run: make test-tcx

      - name: Run imKey host-safe tests
        run: make test-ikc

  wasm-check:
    name: wasm check
    runs-on: macos-14
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: brew install llvm protobuf

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run wasm check
        run: make test-wasm

  docs-links:
    name: markdown links
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-path vendor
            --exclude-path token-core/tcx-examples/iOSExample/Pods
            --exclude-path imkey-core/mobile-sdk/ios/Example/Pods
            --exclude-path imkey-core/ikc-examples/ios/Pods
            './**/*.md'
          fail: true

  dependency-policy:
    name: dependency audit and licenses
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: nightly-2026-04-06
          command: check advisories licenses sources
