name: Mobile Build Smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;25.2.9519653' 'platforms;android-30' 'build-tools;30.0.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - run: bash script/build-android.sh
      - run: ./publish/android/gradlew -p publish/android :tokencore:assembleRelease
      - run: python3 scripts/check-android-aar.py publish/android/tokencore/build/outputs/aar/tokencore-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-aar
          path: publish/android/tokencore/build/outputs/aar/tokencore-release.aar

  ios:
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-14
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - run: brew install protobuf
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: cargo build --locked --release -p tcx -p ikc --target aarch64-apple-ios
      - run: cargo build --locked --release -p tcx -p ikc --target aarch64-apple-ios-sim
      - run: cargo build --locked --release -p tcx -p ikc --target x86_64-apple-ios
