syntax = "proto3";
package api;

message VerifyDerivedKeyParam {
    string id = 1;
    string derivedKey = 2;
}

// Sensitive cache-derived-key API.
//
// `get_derived_key` is not part of the default public production API surface.
// It is compiled into tcx only when the `cache_dk` feature is explicitly
// enabled for mobile/key-cache integration tests or platform-specific builds.
message DerivedKeyResult {
    string id = 1;
    string derivedKey = 2;
}

/// Only used in Android or iOS

message CacheDerivedKeyResult {
    string id = 1;
    bool enableDerivedKey = 2;
    string mode = 3;
}

message WalletId {
    string id = 1;
}

message BiometricModeResult {
    string mode = 1;
}
