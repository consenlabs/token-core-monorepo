[package]
name = "tcx-wasm"
version = "0.7.0"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tcx-keystore = { path = "../tcx-keystore", default-features = false }
tcx-eth = { path = "../tcx-eth", default-features = false }
tcx-tron = { path = "../tcx-tron", default-features = false }
tcx-constants = { path = "../tcx-constants" }
tcx-primitive = { path = "../tcx-primitive", default-features = false }
tcx-common = { path = "../tcx-common" }

bip39 = "=2.2.2"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "=0.4.2", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
js-sys = "=0.3.99"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
anyhow = { version = "=1.0.102" }
uuid = { version = "=1.23.1", features = ["rng-getrandom"] }
tcx-crypto = { path = "../tcx-crypto" }

secp256k1 = { version = "=0.31.1", features = ["rand"] }
bitcoin = "=0.32.9"
sha2 = "=0.11.0"
base64 = "=0.22.1"
hkdf = "=0.13.0"
hmac = "=0.13.0"
chacha20 = "=0.10.0"
chacha20poly1305 = "=0.10.1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.72"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
