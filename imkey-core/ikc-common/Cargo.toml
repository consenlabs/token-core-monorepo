[package]
name = "ikc-common"
version = "0.1.0"
license = "Apache-2.0"
authors = ["wyoyw <wyoyw@126.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wallet-core-common = { path = "../../common/wallet-core-common", features = ["aes", "bip32", "curve", "hash", "path", "utility"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_derive = "=1.0.228"
serde_json = "=1.0.149"
hex = "=0.4.3"
regex = "=1.12.3"
prost = "=0.14.3"
prost-types = "=0.14.3"
anyhow = "=1.0.102"
lazy_static = "=1.5.0"
parking_lot = "=0.12.5"
bitcoin = "=0.32.9"
byteorder = "=1.5.0"
thiserror = "=2.0.18"
http = "=1.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = "=1.11.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", features = ["full"] }
hyper-timeout = "=0.5.2"
hyper-tls = "=0.6.0"
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
tokio = { version = "=1.52.3", features = ["full"] }
