[package]
name = "coin-ckb"
version = "0.1.0"
license = "Apache-2.0"
authors = ["xiemener <xielamenla@qq.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ikc-common = {path = "../../ikc-common"}
ikc-device = {path = "../../ikc-device"}
ikc-transport = {path = "../../ikc-transport"}
wallet-core-common = { path = "../../../common/wallet-core-common", features = ["ckb-address"] }
anyhow = "=1.0.103"
hex = "=0.4.3"
prost = "=0.14.3"
lazy_static = "=1.5.0"
secp256k1 = {version = "=0.31.1", features = ["rand", "recovery"] }
base64 = "=0.22.1"
bitcoin = "=0.32.9"
thiserror = "=2.0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blake2b-rs = "=0.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
blake2b_simd = "=1.0.4"
