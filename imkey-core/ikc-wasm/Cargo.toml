[package]
name = "ikc-wasm"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.102"
hex = "=0.4.3"
ikc-common = { path = "../ikc-common" }
ikc-device = { path = "../ikc-device" }
js-sys = "=0.3.99"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "=0.4.72"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom04 = { package = "getrandom", version = "=0.4.2", features = ["wasm_js"] }
